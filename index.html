<style>
/* Ruang kuliah terbuka: kertas krem, tinta navy, emas sebagai penanda. Satu kolom lebar, kartu hanya untuk materi yang bisa diunduh. */
:root{
  --paper:#f7f4ec; --card:#ffffff; --ink:#10243f; --ink2:#2b3d57; --muted:#5d6b7f; --line:#dcd5c4;
  --gold:#d9a600; --gold-soft:#f6e7b0; --navy:#10243f; --green:#1e6e4b; --orange:#e9832b;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0d1b30; --card:#14284a; --ink:#eef2f8; --ink2:#c9d4e4; --muted:#9fb0c8; --line:#2b4a78; --gold:#f2c200; --gold-soft:#3a3410; --navy:#0a1626; color-scheme:dark; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1140px;margin:0 auto;padding-inline:20px}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* pita wakaf */
.ribbon{background:var(--navy);color:#f3e6b8;font-size:14px}
.ribbon .wrap{display:flex;gap:10px;align-items:center;justify-content:center;padding-block:8px;text-align:center;flex-wrap:wrap}
.ribbon b{color:#f2c200}

/* navigasi */
header.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.nav .wrap{display:flex;align-items:center;gap:18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .logo{background:#fff;border-radius:8px;padding:4px 8px;display:flex}
.brand img{height:30px;width:auto;display:block}
.brand span{font-weight:800;font-size:15px;line-height:1.2}
nav.links{display:flex;gap:18px;margin-left:auto;font-weight:600;font-size:14.5px}
nav.links a{text-decoration:none;color:var(--ink2)}
nav.links a:hover{color:var(--gold)}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{font:inherit;font-size:13px;font-weight:800;border:0;background:transparent;color:var(--muted);padding:5px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:#f2c200}
@media (max-width:820px){nav.links{display:none}.lang{margin-left:auto}}

/* hero */
.hero{padding-block:56px 40px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:center}
@media (max-width:880px){.hero .wrap{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(40px,6vw,72px);letter-spacing:-.01em;margin-block:10px 16px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lead{font-size:18.5px;color:var(--ink2);max-width:58ch;margin:0 0 22px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:800;text-decoration:none;border-radius:10px;padding:12px 20px;font-size:15px}
.btn.primary{background:var(--navy);color:#f2c200}
.btn.ghost{border:2px solid var(--gold);color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.hero figure{margin:0;position:relative}
.hero figure img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:18px;display:block;max-width:100%}
.hero figure figcaption{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(16,36,63,.88);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px}
.hero figure figcaption b{color:#f2c200;font-family:var(--display);font-weight:400;font-size:17px;display:block}
.facts{display:flex;flex-wrap:wrap;gap:26px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.facts div b{display:block;font-family:var(--display);font-weight:400;font-size:34px;color:var(--ink)}
.facts div span{font-size:13.5px;color:var(--muted)}

section{padding-block:56px}
section.alt{background:var(--card);border-block:1px solid var(--line)}
.head{display:grid;gap:8px;margin-bottom:28px;max-width:70ch}
.head h2{font-size:clamp(28px,3.6vw,40px)}
.head p{margin:0;color:var(--ink2)}

/* kisah wakaf */
.story{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px}
@media (max-width:880px){.story{grid-template-columns:minmax(0,1fr)}}
.story p{margin:0 0 14px;color:var(--ink2)}
.pillars{display:grid;gap:12px}
.pillar{border-left:4px solid var(--gold);padding:6px 0 6px 16px}
.pillar b{font-family:var(--display);font-weight:400;font-size:21px;display:block}
.pillar span{color:var(--muted);font-size:15px}

/* materi */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;align-content:start}
section.alt .mod{background:var(--paper)}
.mod .no{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.mod .no i{font-style:normal;background:var(--gold-soft);color:var(--ink);border-radius:6px;padding:1px 8px;font-weight:700}
.mod h3{font-size:21px}
.mod p{margin:0;color:var(--ink2);font-size:15px}
.mod .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.mod .acts a{font-size:14px;font-weight:800;text-decoration:none;border-radius:8px;padding:7px 12px;background:var(--navy);color:#f2c200}
.mod .acts a.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}

/* simulasi */
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center;background:var(--navy);color:#eef2f8;border-radius:20px;padding:32px}
@media (max-width:880px){.sim{grid-template-columns:minmax(0,1fr);padding:22px}}
.sim h2{font-size:clamp(28px,3.4vw,40px);color:#fff}
.sim p{color:#c9d4e4;margin:0 0 12px}
.sim ul{margin:0 0 18px;padding-left:20px;color:#c9d4e4;display:grid;gap:4px}
.sim .btn.primary{background:#f2c200;color:#10243f}
.screen{background:#0d1e36;border:1px solid #2b4a78;border-radius:14px;padding:16px;display:grid;gap:10px;font-size:13.5px}
.screen .bar{display:flex;justify-content:space-between;color:#a9b7cc;font-family:var(--mono);font-size:12px}
.screen .q{background:#1b2f52;border-radius:10px;padding:10px 12px}
.screen .q b{color:#f2c200;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;display:block}
.screen .o{background:#1a3560;border-radius:10px;padding:8px 12px;color:#eef2f8}
.screen .o.on{outline:2px solid #f2c200}
.screen .m{display:grid;grid-template-columns:1fr auto;gap:6px;color:#a9b7cc}
.screen .m span:nth-child(even){font-family:var(--mono);color:#3fb37f}

/* peta belajar */
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;counter-reset:t}
.topic{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.topic .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px;background:var(--paper);border:1px solid var(--line)}
.topic.ready .n{background:var(--green);color:#fff;border-color:var(--green)}
.topic b{display:block;font-size:14.5px;line-height:1.35}
.topic small{font-size:12px;color:var(--muted)}
.topic.ready small{color:var(--green);font-weight:700}
.topic a{text-decoration:none}

/* cara belajar */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.step{border-top:3px solid var(--gold);padding-top:12px}
.step b{font-family:var(--display);font-weight:400;font-size:20px;display:block;margin-bottom:4px}
.step span{color:var(--ink2);font-size:15px}

/* penulis */
.author{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media (max-width:880px){.author{grid-template-columns:minmax(0,1fr)}}
.author p{color:var(--ink2);margin:0 0 12px}
.quote{font-family:var(--display);font-size:24px;line-height:1.35;border-left:4px solid var(--gold);padding-left:18px;margin:0}
.quote small{display:block;font-family:var(--body);font-size:14px;color:var(--muted);margin-top:10px}

footer{background:var(--navy);color:#c9d4e4;padding-block:36px;font-size:14px}
footer .wrap{display:grid;gap:14px}
footer b{color:#f2c200}
footer a{color:#f3e6b8}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn:hover{transform:none}}
</style>
</head>

function render(lang){
  const L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => { const k = el.dataset.i; if (L[k] !== undefined) el.innerHTML = L[k]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  document.getElementById("mods").innerHTML = MODS.map(m => `
    <article class="mod" id="m${m.no}${m.extra?'m':''}">
      <div class="no"><span>${lang==='id'?'Pertemuan':'Session'} ${m.no}</span><i>${m.lvl[lang]}</i><span>${m.pg} ${L.pages}</span></div>
      <h3>${m.t[lang]}</h3>
      <p>${m.d[lang]}</p>
      <div class="acts">
        <a href="materi/${m.f}" target="_blank" rel="noopener">${L.open}</a>
        <a class="sec" href="materi/${m.f}" download>${L.dl}</a>
        ${m.extra ? `<a class="sec" href="materi/${m.extra}" target="_blank" rel="noopener">${L.module}</a>` : ""}
        ${m.sim ? `<a class="sec" href="simulasi/dbcf/">${L.play}</a>` : ""}
      </div>
    </article>`).join("");
  document.getElementById("path").innerHTML = PATH.map((p,i) => `
    <div class="topic ${p.m?'ready':''}"><span class="n">${String(i+1).padStart(2,"0")}</span>
      <span>${p.m ? `<a href="#m${p.m}"><b>${p[lang]}</b></a>` : `<b>${p[lang]}</b>`}<small>${p.m ? L.ready : L.soon}</small></span></div>`).join("");
  try { localStorage.setItem("lif-lang", lang); } catch(e){}
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => render(b.dataset.lang)));
let start = "id";
try { start = localStorage.getItem("lif-lang") || (location.hash==="#en" || (navigator.language||"").slice(0,2)!=="id" ? "en" : "id"); } catch(e){}
if (location.hash==="#en") start = "en";
if (location.hash==="#id") start = "id";
render(start);
</script>
