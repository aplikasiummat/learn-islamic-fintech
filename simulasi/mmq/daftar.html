<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar Kelompok · Simulasi MMQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gaya.css?v=4">
<script>/* bila pustaka gagal dimuat (jaringan lemah), muat ulang halaman sekali */
addEventListener('error', function (e) { try { if (/is not defined|Cannot read/.test(e.message || '') && !sessionStorage.getItem('pnm-rl')) { sessionStorage.setItem('pnm-rl', '1'); location.reload() } } catch (x) { } });
addEventListener('load', function () { setTimeout(function () { try { sessionStorage.removeItem('pnm-rl') } catch (x) { } }, 8000) });</script>
<script src="../saham/lib/mqtt-5.10.1.min.js"></script>
<script src="kelas.js?v=5"></script>
<script src="kelompok.js?v=1"></script>
<script src="arena.js?v=2"></script>
<style>
  .mem{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .mem span{background:var(--soft);border-radius:999px;padding:4px 12px;font-weight:600}
  .wait{font-size:3rem;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
</style>
</head>
<body>
<div class="top"><div class="t">Ruang Tunggu Kelompok<span class="sub"> · Simulasi MMQ PNM</span></div><span class="chip" id="hdrGroup"></span><span class="conn" id="conn" title="Terhubung ke kelas"></span></div>
<div class="wrap" id="app"></div>
<script>
'use strict';
const $ = s => document.querySelector(s), app = $('#app'), qs = new URLSearchParams(location.search);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let R = PNMReg.get(), CH = null, CTL = null, beat = null;
if (R && qs.get('kelas') && PNMKelas.cleanCode(qs.get('kelas')) !== R.kode) R = null;  // kelas baru: daftar ulang

const ALUR = ['Pengajar membuka kelas', 'Daftar kelompok', 'Ruang tunggu', 'Game 1', 'Game 2', 'Game 3'];
function form() {
  app.innerHTML = `<div class="card hero">
    <div class="kicker">Simulasi MMQ PNM · Hari ke-2</div>
    <h1 style="font-size:2.5rem">Daftarkan kelompok Anda</h1>
    <p class="lead">Satu laptop untuk satu kelompok sepanjang hari. Urutan pendaftaran menentukan pasangan di Game 2, jadi kelompok yang lebih cepat mendaftar mendapat nomor urut lebih awal.</p>
  </div>
  <div class="card">
    ${Arena.coach(ALUR, 1, 'pastikan kode kelas sama dengan yang tampil di layar pengajar, sepakati nama kelompok, tulis <b>nama lengkap</b> setiap anggota, lalu tekan <b>Daftarkan kelompok</b>.')}
    <div class="row">
      <div><label for="kode">Kode kelas dari layar pengajar</label>
      <input id="kode" maxlength="8" value="${esc(qs.get('kelas') || (R && R.kode) || '')}" placeholder="contoh: K7PQ2" style="text-transform:uppercase;font-family:'JetBrains Mono',monospace;font-size:1.5rem;letter-spacing:.15em"></div>
      <div><label for="nama">Nama kelompok</label>
      <input id="nama" maxlength="30" placeholder="contoh: Kelompok Cempaka"></div>
    </div>
    <label for="ang">Nama lengkap anggota, satu nama per baris</label>
    <textarea id="ang" rows="6" style="font-size:1.1rem;padding:14px;border-radius:12px;border:2px solid var(--line);width:100%;font-family:inherit;background:var(--card);color:var(--ink)" placeholder="Budi Santoso&#10;Siti Aminah&#10;Rahmat Hidayat"></textarea>
    <p class="no" id="err"></p>
    <button class="btn gold wide" id="go">Daftarkan kelompok ▶</button>
  </div>`;
  $('#go').onclick = () => {
    const kode = PNMKelas.cleanCode($('#kode').value), nama = $('#nama').value.trim();
    const anggota = $('#ang').value.split('\n').map(x => x.trim().replace(/\s+/g, ' ')).filter(Boolean).slice(0, 12);
    if (!kode) return $('#err').textContent = 'Kode kelas wajib diisi. Lihat layar pengajar; pengajar membuka kelas lebih dulu.';
    if (nama.length < 3) return $('#err').textContent = 'Nama kelompok wajib diisi (minimal 3 huruf).';
    if (anggota.length < 2) return $('#err').textContent = 'Tuliskan nama lengkap minimal dua anggota, satu nama per baris.';
    const pendek = anggota.find(a => a.length < 3);
    if (pendek) return $('#err').textContent = 'Nama "' + pendek + '" terlalu pendek. Tuliskan nama lengkap.';
    R = PNMReg.baru(nama, anggota, kode); hdr(); sambung(); tunggu();
  };
}
function hdr() { $('#hdrGroup').textContent = R ? R.nama : '' }
function tunggu() {
  if (!R) return form();
  const d = CTL && CTL.draw && CTL.draw[R.id];
  const lawan = d && Object.entries(CTL.draw).find(([id, x]) => id !== R.id && x.p === d.p && d.p > 0);
  const urut = CTL && CTL.urut && CTL.urut[R.id];
  const tahap = CTL && CTL.aktif === 'audit' ? 5 : CTL && CTL.aktif === 'cp' ? 4 : CTL && CTL.aktif === 'akad' ? 3 : 2;
  app.innerHTML = `<div class="card hero center">
      <div class="kicker">${urut ? 'Urutan daftar ke-' + urut : 'Kelompok terdaftar'}</div>
      <div class="wait" style="margin:6px 0">⏳</div>
      <div class="big" style="font-size:2.6rem;color:#fff">${esc(R.nama)}</div>
      <div class="mem" style="justify-content:center">${R.anggota.map(a => `<span style="background:rgba(255,255,255,.15);color:#fff">${esc(a)}</span>`).join('')}</div>
      <p class="lead">${CH ? 'Terhubung ke kelas <b>' + esc(R.kode) + '</b>.' : 'Sedang menghubungkan ke kelas ' + esc(R.kode) + '…'}</p>
    </div>
    <div class="card">${Arena.coach(ALUR, tahap, 'biarkan layar ini terbuka. Begitu pengajar menekan <b>Mulai</b>, layar pindah sendiri ke game. Setelah satu game selesai, kembali ke halaman ini.')}</div>
    ${d ? `<div class="card"><div class="kicker">Pasangan Game 2 · Cabang vs Pusat</div>
      ${d.p > 0 ? `<h2>Pertandingan ${d.p}: ${esc(R.nama)} &amp; ${lawan ? esc(CTL.nama[lawan[0]] || 'kelompok lain') : '–'}</h2>
      <p class="lead">Babak 1 · ULaMM: Anda menjadi <b>${d.s === 'A' ? 'Kantor Pusat' : 'Cabang'}</b>. Babak 2 · Mekaar: peran bertukar menjadi <b>${d.s === 'A' ? 'Cabang' : 'Kantor Pusat'}</b>. Skor dihitung untuk satu PNM: kedua kelompok menang atau kalah bersama.</p>`
      : d.s === 'mesin' ? `<h2>${esc(R.nama)} melawan komputer</h2><p class="lead">Babak 1 · ULaMM: Anda Kantor Pusat dan komputer menjadi Cabang. Babak 2 · Mekaar: Anda Cabang dan komputer menjadi Kantor Pusat.</p>`
      : `<p class="lead">Jumlah kelompok ganjil, sehingga kelompok Anda memainkan kedua peran sendiri pada laptop ini.</p>`}</div>` : ''}
    <div class="card"><h3>Bila layar tidak pindah sendiri</h3>
      <div class="row"><a class="btn ghost" href="pilih-akad.html?kelas=${esc(R.kode)}&auto=1">Game 1 · Pilih Akadnya</a><a class="btn ghost" href="cabang-pusat.html?kelas=${esc(R.kode)}&auto=1">Game 2 · Cabang vs Pusat</a><a class="btn ghost" href="jejak-audit.html?kelas=${esc(R.kode)}&auto=1">Game 3 · Jejak Audit</a></div>
      <p class="note">Salah menulis nama? <a href="#" id="ubah">Daftar ulang kelompok</a> (urutan daftar ikut berubah).</p></div>`;
  $('#ubah').onclick = e => { e.preventDefault(); if (CH) CH.clear('reg-' + R.id); PNMReg.clear(); R = null; hdr(); form() };
}
function kirim() { if (CH && R) CH.setStatus('reg-' + R.id, PNMReg.status(R, { di: 'ruang tunggu' })) }
async function sambung() {
  if (!R || !window.mqtt) return;
  try {
    CH = await PNMKelas.join(R.kode, { role: 'player', onConn: v => $('#conn').classList.toggle('on', v), onCtl: o => { CTL = o; tunggu(); arahkan() } });
    $('#conn').classList.add('on'); kirim(); clearInterval(beat); beat = setInterval(kirim, 20000); tunggu();
  } catch (e) { CH = null; $('#conn').classList.remove('on'); tunggu(); setTimeout(() => { if (!CH && R) sambung() }, 4000) }
}
// pengajar memulai game: pindah otomatis ke halaman game, sekali untuk setiap aba-aba
function arahkan() {
  if (!CTL || !R || !CTL.aktif || !CTL.aktifT || CTL.aktifT <= (R.pergi || 0)) return;
  if (CTL.aktif === 'cp' && !(CTL.draw && CTL.draw[R.id])) return;
  R.pergi = CTL.aktifT; PNMReg.set(R);
  location.href = PNMReg.HAL[CTL.aktif] + '?kelas=' + encodeURIComponent(R.kode) + '&auto=1';
}
hdr();
if (R) { sambung(); tunggu() } else form();
</script>
</body>
</html>
