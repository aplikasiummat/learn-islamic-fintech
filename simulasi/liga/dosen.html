<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Liga Crowdfunding</title>
<link rel="icon" href="../../assets/logo-tazkia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../komite/komite.css?v=3">
<link rel="stylesheet" href="liga.css?v=1">
<script src="../saham/lib/mqtt-5.10.1.min.js"></script>
<script src="../saham/lib/qrcode-1.0.0.min.js"></script>
<script src="data.js?v=1"></script>
<script src="kelas.js?v=1"></script>
<script src="rr.js?v=1"></script>
<style>
.kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:900px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi>div{background:#0b1a33;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.kpi b{display:block;font-family:'JetBrains Mono',monospace;font-size:1.9rem;line-height:1.1}
.kpi small{color:var(--muted)}
.code{font-family:'JetBrains Mono',monospace;font-size:3rem;letter-spacing:.2em;color:var(--gold2);line-height:1}
#qr{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;text-align:center;margin:10px 0 20px}
.pod>div{background:#0b1a33;border:1px solid var(--line);border-radius:16px 16px 6px 6px;padding:16px 10px}
.pod .em{font-size:2.6rem}
.pod b{display:block;font-family:'Archivo',sans-serif;font-size:1.15rem}
.pod .p1{border-color:var(--gold);min-height:230px;background:linear-gradient(180deg,#3a2a08,#0b1a33)}
.pod .p2{min-height:190px} .pod .p3{min-height:160px}
body.proj .hideproj{display:none!important}
body.proj html{font-size:22px}
</style>
</head>
<body>
<div class="top"><a class="chip" href="index.html">☰ Menu</a><div class="t">Dashboard Pengajar · <span>Liga Crowdfunding Syariah</span></div><span class="chip off" id="conn">○ Belum ada kelas</span><button class="chip" type="button" id="proj" style="cursor:pointer">📽️ Mode layar</button></div>
<div class="wrap" id="app"></div>
<script>
'use strict';
const D = window.LIGA, $ = s => document.querySelector(s), app = $('#app');
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem('ligadosen.' + k); return v ? JSON.parse(v) : d } catch (e) { return d } }, set(k, v) { try { localStorage.setItem('ligadosen.' + k, JSON.stringify(v)) } catch (e) { } } };
let CH = null, KODE = store.get('kode', ''), CTL = store.get('ctl', null), P = store.get('peserta', {}), hapusT = store.get('hapusT', 0), LIVE = {}, CFG = store.get('cfg', { auto: true, n: 5 }), hitung = null;
$('#proj').onclick = () => { document.body.classList.toggle('proj'); if (document.body.classList.contains('proj')) document.documentElement.requestFullscreen?.().catch(() => { }); else document.exitFullscreen?.().catch(() => { }) };
const urlMain = () => new URL('main.html?kelas=' + KODE, location.href).href;
const baruCtl = () => ({ judul: 'Liga Crowdfunding Syariah', pesan: '', info: { n: 0, sel: 0 }, t: Date.now() });

function awal() {
  app.innerHTML = `<div class="card hero"><div class="kicker">Untuk pengajar</div><h1>Satu klik, liga langsung jalan</h1>
    <p style="color:#dbe6f6;max-width:780px">Klik tombol di bawah. Kode kelas muncul besar di layar; mahasiswa mengetik kode itu lalu mengerjakan tiga simulasi berurutan: Donation Based, Reward Based, dan Agregator. Begitu semua tuntas, round robin berjalan sendiri dan dua teratas bertemu di final. Biarkan halaman ini terbuka karena dashboard inilah wasitnya.</p>
    <div class="row" style="margin-top:16px"><button class="btn gold" id="baru" type="button" style="font-size:1.3rem;min-height:70px;min-width:320px">▶ Buka kelas</button></div></div>
    <details class="card"><summary style="cursor:pointer;font-weight:700">Buka lagi kelas yang sudah ada</summary><div class="row" style="margin-top:12px"><input id="kd" placeholder="Kode kelas" maxlength="8" style="max-width:260px;text-transform:uppercase;font-family:'JetBrains Mono',monospace" value="${esc(KODE)}"><button class="btn" id="buka" type="button">Buka</button></div></details>`;
  $('#baru').onclick = () => { KODE = KomiteKelas.newCode(); P = {}; LIVE = {}; hapusT = 0; CTL = baruCtl(); simpan(); hubung() };
  $('#buka').onclick = () => { const k = KomiteKelas.cleanCode($('#kd').value); if (k.length < 4) return; if (k !== KODE) { P = {}; LIVE = {}; hapusT = 0; CTL = null } KODE = k; CTL = CTL || baruCtl(); simpan(); hubung() };
}
function simpan() { store.set('kode', KODE); store.set('ctl', CTL); store.set('peserta', P); store.set('hapusT', hapusT); store.set('cfg', CFG) }
function setConn(on, t) { const c = $('#conn'); c.className = 'chip ' + (on ? 'on' : 'off'); c.textContent = t || (on ? '● Kelas ' + KODE + ' aktif' : '○ Menyambung ulang ...') }
async function hubung() {
  setConn(false, '○ Membuka kelas ' + KODE + ' ...'); render();
  try {
    if (CH) CH.close();
    CH = await KomiteKelas.join(KODE, {
      role: 'host',
      onStatus: (id, o) => { if (o && (o.t || 0) < hapusT) return; if (o) P[id] = o; else delete P[id]; simpan(); renderData(); infoNanti() },
      onPair: (k, o) => { if (o) LIVE[k] = o; else delete LIVE[k]; renderLiga() },
      onConn: on => setConn(on),
    });
    await CH.setCtl(CTL); setConn(true);
  } catch (e) { setConn(false, '✕ Gagal tersambung. Periksa internet, lalu muat ulang.') }
}
function pubCtl(perubahan) { CTL = Object.assign({}, CTL, perubahan, { t: Date.now() }); simpan(); if (CH) CH.setCtl(CTL).catch(() => { }) }
// ringkasan kemajuan kelas untuk ruang tunggu peserta (dikirim paling sering tiap 2 detik)
let infoT = null;
function infoNanti() { if (infoT) return; infoT = setTimeout(() => { infoT = null; const R = rows(), sel = R.filter(r => r.sel).length; if (!CTL.info || CTL.info.n !== R.length || CTL.info.sel !== sel) pubCtl({ info: { n: R.length, sel } }) }, 2000) }

function rows() { return Object.entries(P).map(([id, o]) => Object.assign({ id }, o)).sort((a, b) => (b.tahap - a.tahap) || (b.total - a.total)) }
function render() {
  if (!KODE) return awal();
  const url = urlMain();
  app.innerHTML = `
  <div class="grid2 hideproj">
    <div class="card hero"><div class="kicker">Kode kelas</div><div class="code">${KODE}</div>
      <p style="color:#dbe6f6;margin:10px 0 4px">Mahasiswa membuka <b>learnislamicfintech.tazkia.ac.id/simulasi/liga</b>, mengetik kode ini, mengisi nama dan NIM, lalu langsung mengerjakan Tahap 1. Atau pindai QR.</p>
      <p style="word-break:break-all;margin:0"><a href="${url}" target="_blank" rel="noopener">${esc(url)}</a></p></div>
    <div class="card" style="text-align:center"><div id="qr"></div><p class="muted" style="margin:8px 0 0">Pindai untuk bergabung</p></div>
  </div>
  <div class="card hideproj"><div class="row"><input id="pesan" placeholder="Kirim pengumuman ke semua layar, misalnya: 10 menit lagi" maxlength="120" style="flex:3"><button class="btn" id="kirimP" type="button" style="flex:1">📣 Kirim</button></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="csv" type="button">⬇️ Unduh CSV</button><button class="btn ghost sm" id="bersih" type="button">🧹 Kosongkan papan</button><button class="btn ghost sm" id="tutup" type="button">Ganti kelas</button></div></div>
  <div class="card" id="ligaCard">
    <div class="row" style="align-items:flex-start"><div style="flex:3;min-width:260px"><div class="kicker">Babak liga</div><h2 style="margin-bottom:4px">🏆 Round robin dan final</h2>
      <p class="muted hideproj" style="margin:0">Peserta dibagi ke grup 3 sampai 4 orang secara seimbang (berdasarkan total nilai tiga tahap). Setiap orang bertemu semua lawan di grupnya; menang 3 poin, seri 1. Dua teratas klasemen gabungan masuk final. Soal laga diambil dari ketiga simulasi.</p></div>
      <div class="hideproj" style="flex:2;min-width:240px"><label style="margin-top:0"><input type="checkbox" id="auto" style="width:auto;margin-right:8px"${CFG.auto ? ' checked' : ''}>Mulai otomatis saat semua tuntas tiga tahap</label>
        <label for="nS">Soal per laga</label><select id="nS">${[3, 5, 7].map(n => `<option value="${n}"${CFG.n === n ? ' selected' : ''}>${n} soal · sekitar ${Math.ceil(n * 0.9) + 1} menit</option>`).join('')}</select>
        <div class="row" style="margin-top:10px"><button class="btn gold sm" id="go" type="button">⚔️ Mulai round robin sekarang</button><button class="btn ghost sm" id="reset" type="button">↺ Ulangi liga</button></div></div></div>
    <div id="ligaBody" style="margin-top:14px"></div></div>
  <div id="data"></div>`;
  if (window.QRCode) new QRCode($('#qr'), { text: url, width: 210, height: 210 });
  $('#kirimP').onclick = () => { const t = $('#pesan').value.trim(); if (t) { pubCtl({ pesan: t + ' ' }); $('#pesan').value = '' } };
  $('#csv').onclick = csv;
  $('#bersih').onclick = () => { if (!konfirmasi('bersih', '🧹 Kosongkan papan', 'Klik lagi untuk mengosongkan')) return; hapusT = Date.now(); Object.keys(P).forEach(id => CH && CH.clear(id)); P = {}; simpan(); renderData() };
  $('#tutup').onclick = () => { if (CH) CH.close(); CH = null; KODE = ''; store.set('kode', ''); setConn(false, '○ Belum ada kelas'); render() };
  $('#auto').onchange = e => { CFG.auto = e.target.checked; hitung = null; simpan(); renderLiga() };
  $('#nS').onchange = e => { CFG.n = +e.target.value; simpan() };
  $('#go').onclick = () => { if (!CTL.tur || CTL.tur.st !== 'run') mulaiLiga() };
  $('#reset').onclick = () => { if (!konfirmasi('reset', '↺ Ulangi liga', 'Klik lagi untuk menghapus liga')) return; hitung = null; pubTur(null) };
  renderData(); renderLiga();
}
const klik = {};
function konfirmasi(id, asli, tanya) { const b = $('#' + id); if (Date.now() - (klik[id] || 0) < 4000) { klik[id] = 0; return true } klik[id] = Date.now(); b.textContent = tanya; setTimeout(() => { if ($('#' + id)) $('#' + id).textContent = asli }, 4000); return false }

/* ---------- mesin liga: dashboard ini adalah wasit ---------- */
function acak(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]] } return a }
// soal tiap laga bergiliran dari tiga simulasi dan tidak berulang selama bank masih cukup
function pilihSoal(dipakai, n, r) {
  const sudah = new Set(dipakai), out = [];
  for (let i = 0; i < n; i++) {
    const s = (r * n + i) % 3;
    let pool = acak(D.BANK.map((q, k) => k).filter(k => D.BANK[k].s === s && !sudah.has(k)));
    if (!pool.length) pool = acak(D.BANK.map((q, k) => k).filter(k => !sudah.has(k)));
    if (!pool.length) pool = acak(D.BANK.map((q, k) => k).filter(k => !out.includes(k)));
    out.push(pool[0]); sudah.add(pool[0]);
  }
  return out;
}
const batas = n => Date.now() + n * D.DETIK * 1000 + 60000;
function pubTur(T) { pubCtl({ tur: T }); renderLiga() }
function rondeGrup(T, r) { return { f: 'grup', qs: pilihSoal(T.R.flatMap(x => x.qs), T.n, r), t0: Date.now(), dl: batas(T.n), M: T.J[r].map((m, k) => m.b ? { id: r + '-' + k, g: m.g, a: m.a, b: m.b, w: null } : { id: r + '-b' + k, g: m.g, a: m.a, b: null, w: m.a, sa: 0, sb: null, why: 'istirahat' }) } }
function rondeFinal(T, a, b) { return { f: 'final', qs: pilihSoal(T.R.flatMap(x => x.qs), T.n, T.R.length), t0: Date.now(), dl: batas(T.n), M: [{ id: 'F', a, b, w: null }] } }
function mulaiLiga() {
  const R = rows().filter(r => r.sel);
  if (R.length < 2) { renderLiga('Perlu minimal 2 peserta yang sudah tuntas tiga tahap.'); return }
  const P2 = {}; R.forEach(r => P2[r.id] = { nm: r.nama, q: r.total });
  const ids = R.map(r => r.id).sort((a, b) => P2[b].q - P2[a].q);
  const T = { id: 'L' + Math.random().toString(36).slice(2, 7), st: 'run', n: CFG.n, P: P2, G: [], J: [], R: [], cur: 0, juara: null };
  if (ids.length === 2) T.R.push(rondeFinal(T, ids[0], ids[1]));
  else { T.G = RR.grup(ids); T.J = RR.jadwal(T.G); T.R.push(rondeGrup(T, 0)) }
  hitung = null; pubTur(T);
}
function mesin() {
  if (!CH || !CTL || !KODE) return;
  const T = CTL.tur;
  if (!T) {
    const R = rows(), sel = R.filter(r => r.sel);
    if (CFG.auto && sel.length >= 2 && sel.length === R.length) { if (!hitung) hitung = Date.now() + 8000; if (Date.now() >= hitung) mulaiLiga() }
    else hitung = null;
    renderLiga(); return;
  }
  if (T.st !== 'run') return;
  const R = T.R[T.cur], now = Date.now(); let ubah = false;
  R.M.forEach(m => {
    if (m.w) return;
    const la = LIVE[RR.kunci(T, m, m.a)], lb = LIVE[RR.kunci(T, m, m.b)], beres = la && la.done && lb && lb.done;
    if (!beres && now <= R.dl) return;
    const sa = la ? la.skor : 0, sb = lb ? lb.skor : 0, ta = la ? la.detik : 1e9, tb = lb ? lb.detik : 1e9;
    let w, why = beres ? '' : 'waktu laga habis';
    if (sa !== sb) w = sa > sb ? m.a : m.b;
    else if (R.f === 'grup') { w = 'seri'; why = 'skor sama' }
    else if (ta !== tb) { w = ta < tb ? m.a : m.b; why = 'skor sama, lebih cepat menjawab' }
    else { w = T.P[m.a].q >= T.P[m.b].q ? m.a : m.b; why = 'skor dan waktu sama, total nilai tiga tahap lebih tinggi' }
    Object.assign(m, { w, sa, sb, why }); ubah = true;
  });
  if (R.M.every(m => m.w)) {
    if (!R.tEnd) { R.tEnd = now; ubah = true }
    else if (now - R.tEnd > 5000) {
      if (R.f === 'final') { T.juara = R.M[0].w; T.st = 'done' }
      else if (T.cur + 1 < T.J.length) T.R.push(rondeGrup(T, T.cur + 1));
      else { const K = RR.klasemen(T); T.R.push(rondeFinal(T, K[0].pid, K[1].pid)) }
      if (T.st === 'run') T.cur = T.R.length - 1;
      ubah = true;
    }
  }
  if (ubah) pubTur(T); else renderLiga();
}
setInterval(mesin, 1000);

function renderLiga(pesan) {
  const box = $('#ligaBody'); if (!box) return;
  const T = CTL && CTL.tur, mm = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  if ($('#go')) $('#go').disabled = !!T;
  let h = pesan ? `<p style="color:var(--red)">${esc(pesan)}</p>` : '';
  if (!T) {
    const R = rows(), sel = R.filter(r => r.sel).length;
    h += `<p><b>${sel} dari ${R.length}</b> peserta sudah tuntas tiga tahap.${hitung ? ` <b style="color:var(--gold2)">Round robin dimulai dalam ${Math.max(0, Math.ceil((hitung - Date.now()) / 1000))} detik.</b>` : CFG.auto ? ' Round robin langsung mulai begitu semua tuntas. Bila ada yang tertahan, tekan <b>Mulai round robin sekarang</b> (yang belum tuntas tidak ikut).' : ''}</p>`;
    box.innerHTML = h; return;
  }
  if (T.st === 'run') {
    const R = T.R[T.cur], sisa = Math.max(0, Math.round((R.dl - Date.now()) / 1000)), sel = R.M.filter(m => m.w).length;
    h += `<p><b style="color:var(--gold2)">${esc(RR.namaRonde(T, T.cur))}</b> · ${sel} dari ${R.M.length} laga selesai · batas waktu ${mm(sisa)}${R.tEnd ? ' · <b>laga berikutnya segera dimulai</b>' : ''}${T.G.length ? ' · ' + T.G.length + ' grup, ' + T.J.length + ' putaran, lalu final' : ''}</p>`;
    h += `<div class="card" style="background:var(--bg2)"><h3>${R.f === 'final' ? '🏆 Final' : 'Laga putaran ini'}</h3>${RR.laga(T, LIVE, null)}</div>`;
  } else {
    const F = T.R[T.R.length - 1].M[0], K = RR.klasemen(T), tiga = K.filter(x => x.pid !== F.a && x.pid !== F.b)[0], run = F.w === F.a ? F.b : F.a;
    const pod = [T.juara, run, tiga && tiga.pid];
    h += `<div class="pod">${[1, 0, 2].map(k => pod[k] ? `<div class="p${k + 1}"><div class="em">${['🏆', '🥈', '🥉'][k]}</div><b>${esc(T.P[pod[k]].nm)}</b><div class="muted">${['Juara liga', 'Runner-up', 'Peringkat ketiga'][k]}</div>${k < 2 ? `<div style="font-family:'JetBrains Mono',monospace;color:var(--gold2)">${F.a === pod[k] ? F.sa : F.sb}</div>` : ''}</div>` : '<div style="visibility:hidden"></div>').join('')}</div>`;
  }
  if (T.G.length) h += RR.tabel(T, null);
  box.innerHTML = h;
}

/* ---------- papan kemajuan tiga tahap ---------- */
function renderData() {
  const box = $('#data'); if (!box) return;
  const R = rows(), sel = R.filter(r => r.sel), rata = sel.length ? Math.round(sel.reduce((s, r) => s + r.total, 0) / sel.length) : 0;
  const perT = D.TAHAP.map((_, i) => { const v = R.map(r => r.sc && r.sc[i]).filter(x => typeof x === 'number'); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null });
  box.innerHTML = `
  <div class="kpi"><div><b>${R.length}</b><small>peserta</small></div>${D.TAHAP.map((t, i) => `<div><b style="color:${t.warna}">${R.filter(r => r.sc && r.sc[i] != null).length}</b><small>tuntas ${esc(t.pendek)}</small></div>`).join('')}<div><b style="color:var(--gold2)">${rata}</b><small>rata-rata total (maks 300)</small></div></div>
  <div class="card"><h3>Kemajuan tiga tahap</h3>${R.length ? `<div class="scroll"><table class="tb"><tr><th>#</th><th>Peserta</th><th>Kemajuan</th>${D.TAHAP.map(t => `<th style="text-align:right">${t.ikon} ${esc(t.pendek)}</th>`).join('')}<th style="text-align:right">Total</th><th>Status</th></tr>
    ${R.map((r, k) => `<tr><td>${k + 1}</td><td><b>${esc(r.nama)}</b><br><small class="muted">${esc(r.nim || '')}</small></td>
      <td><div class="prog3">${D.TAHAP.map((_, i) => `<i class="${r.sc && r.sc[i] != null ? 'ok' : r.tahap === i ? 'on' : ''}"></i>`).join('')}</div></td>
      ${D.TAHAP.map((_, i) => `<td class="n">${r.sc && r.sc[i] != null ? r.sc[i] : '–'}</td>`).join('')}
      <td class="n" style="color:var(--gold2);font-size:1.15rem"><b>${r.total}</b></td>
      <td>${r.sel ? '<span class="pill w">Tuntas</span>' : `<span class="pill p">Tahap ${r.tahap + 1}</span>`}</td></tr>`).join('')}</table></div>` : '<p class="muted">Belum ada peserta. Tampilkan QR atau kode kelas di layar.</p>'}</div>
  <div class="card"><h3>Rata-rata nilai per tahap</h3><div class="bkbars">${D.TAHAP.map((t, i) => `<div class="bkbar"><div class="lb">${t.ikon} ${esc(t.nama)}</div><div class="tr"><i style="width:${perT[i] == null ? 0 : perT[i]}%;background:${perT[i] == null ? '#25406b' : perT[i] >= 70 ? 'var(--green)' : perT[i] >= 55 ? 'var(--amber)' : 'var(--red)'}"></i></div><div class="muted" style="text-align:right">${perT[i] == null ? '–' : perT[i]}</div></div>`).join('')}</div>
    <p class="muted" style="margin-bottom:0">Merah berarti simulasi itu perlu dibahas ulang di kelas.</p></div>`;
}
function csv() {
  const R = rows(), T = CTL && CTL.tur, K = T ? RR.klasemen(T) : [];
  const head = ['No', 'Nama', 'NIM'].concat(D.TAHAP.map(t => t.pendek), ['Total', 'Status', 'Grup', 'Poin liga', 'Selisih skor', 'Hasil akhir']);
  const lines = [head].concat(R.map((r, k) => { const x = K.find(y => y.pid === r.id); const fin = T && T.st === 'done' ? (T.juara === r.id ? 'Juara' : T.R[T.R.length - 1].M[0].a === r.id || T.R[T.R.length - 1].M[0].b === r.id ? 'Runner-up' : '') : ''; return [k + 1, r.nama, r.nim].concat(D.TAHAP.map((_, i) => r.sc && r.sc[i] != null ? r.sc[i] : ''), [r.total, r.sel ? 'Tuntas' : 'Tahap ' + (r.tahap + 1), x && x.g >= 0 ? 'ABCDEFGH'[x.g] : '', x ? x.pts : '', x ? x.sf - x.sa : '', fin]) }));
  const txt = '﻿' + lines.map(l => l.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv' })); a.download = 'liga-crowdfunding-' + KODE + '.csv'; a.click();
}
if (KODE) hubung(); else render();
